<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Painel · Now Playing Widget</title>
<style>
  :root {
    --bg:#0a0a0a; --panel:#141414; --panel-2:#1c1c1c; --line:#262626;
    --text:#f2f2f2; --muted:#8a8a8a; --accent:#1db954; --danger:#e2444a;
    --radius:16px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:"Segoe UI",-apple-system,system-ui,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .topbar {
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 28px; border-bottom:1px solid var(--line);
    position:sticky; top:0; background:rgba(10,10,10,.85); backdrop-filter:blur(8px); z-index:10;
  }
  .brand { display:flex; align-items:center; gap:12px; font-weight:700; font-size:17px; }
  .brand .dot { width:10px; height:10px; border-radius:50%; background:var(--accent); box-shadow:0 0 10px var(--accent); }
  .btn {
    border:none; border-radius:999px; padding:10px 20px; font-weight:600; font-size:14px;
    cursor:pointer; display:inline-flex; align-items:center; gap:8px; transition:all .15s ease;
    background:var(--panel-2); color:var(--text); text-decoration:none;
  }
  .btn:hover { background:#2a2a2a; }
  .btn.green { background:var(--accent); color:#000; }
  .btn.green:hover { background:#1ed760; }
  .btn.ghost-danger { color:var(--danger); }
  .btn.ghost-danger:hover { background:rgba(226,68,74,.12); }
  .btn.sm { padding:7px 14px; font-size:13px; }

  .wrap { max-width:1240px; margin:0 auto; padding:28px; }

  /* estado vazio */
  .empty-state {
    text-align:center; padding:90px 24px; max-width:460px; margin:40px auto;
    background:var(--panel); border:1px solid var(--line); border-radius:24px;
  }
  .empty-state h1 { font-size:24px; margin-bottom:10px; }
  .empty-state p { color:var(--muted); margin-bottom:26px; line-height:1.6; }

  .grid { display:grid; grid-template-columns:300px 1fr; gap:22px; align-items:start; }
  @media (max-width:900px){ .grid{ grid-template-columns:1fr; } }

  .card { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); }
  .card h2 { font-size:13px; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); padding:16px 18px; border-bottom:1px solid var(--line); }
  .card .body { padding:18px; }

  /* lista de conexões */
  .conn {
    display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:12px;
    cursor:pointer; transition:background .15s ease; border:1px solid transparent;
  }
  .conn:hover { background:var(--panel-2); }
  .conn.active { background:var(--panel-2); border-color:var(--accent); }
  .conn img, .conn .avatar {
    width:40px; height:40px; border-radius:50%; object-fit:cover; flex-shrink:0;
    background:#2a2a2a; display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--muted);
  }
  .conn .info { min-width:0; flex:1; }
  .conn .name { font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .conn .sub { font-size:12px; color:var(--muted); }
  .badge { font-size:10px; padding:2px 7px; border-radius:999px; background:#2a2a2a; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
  .badge.premium { background:rgba(29,185,84,.15); color:var(--accent); }

  /* preview */
  .preview-stage {
    background:
      linear-gradient(45deg,#151515 25%,transparent 25%),
      linear-gradient(-45deg,#151515 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#151515 75%),
      linear-gradient(-45deg,transparent 75%,#151515 75%);
    background-size:24px 24px; background-position:0 0,0 12px,12px -12px,-12px 0;
    border-radius:12px; padding:26px; display:flex; justify-content:center; overflow:auto;
  }
  .preview-stage iframe { width:680px; height:200px; border:0; }

  /* controles */
  .control { margin-bottom:18px; }
  .control:last-child { margin-bottom:0; }
  .control label { display:block; font-size:13px; font-weight:600; margin-bottom:8px; }
  .control .val { color:var(--muted); font-weight:400; margin-left:6px; }
  input[type=range]{ width:100%; accent-color:var(--accent); }
  .swatches { display:flex; gap:8px; flex-wrap:wrap; }
  .swatch { width:30px; height:30px; border-radius:8px; cursor:pointer; border:2px solid transparent; }
  .swatch.sel { border-color:#fff; }
  input[type=color]{ width:44px; height:30px; border:none; background:none; border-radius:8px; cursor:pointer; padding:0; }
  .toggle-row { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); }
  .toggle-row:last-child { border-bottom:0; }
  .toggle-row span { font-size:14px; }
  .switch { position:relative; width:42px; height:24px; }
  .switch input { display:none; }
  .switch .slider { position:absolute; inset:0; background:#333; border-radius:999px; transition:.2s; }
  .switch .slider:before { content:""; position:absolute; width:18px; height:18px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; }
  .switch input:checked + .slider { background:var(--accent); }
  .switch input:checked + .slider:before { transform:translateX(18px); }

  /* url */
  .url-row { display:flex; gap:8px; margin-top:6px; }
  .url-row input { flex:1; background:var(--bg); border:1px solid var(--line); color:var(--accent); padding:11px 13px; border-radius:10px; font-family:monospace; font-size:12px; }

  /* métricas */
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  @media (max-width:700px){ .stats{ grid-template-columns:repeat(2,1fr);} }
  .stat { background:var(--panel-2); border-radius:12px; padding:16px; }
  .stat .num { font-size:26px; font-weight:800; letter-spacing:-.5px; }
  .stat .lbl { font-size:12px; color:var(--muted); margin-top:2px; }
  .toplist { list-style:none; }
  .toplist li { display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .toplist li:last-child { border-bottom:0; }
  .toplist .rank { color:var(--muted); font-weight:700; width:22px; }
  .toplist .nm { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 10px; }
  .toplist .ct { color:var(--accent); font-weight:700; font-size:13px; }
  .two-col { display:grid; grid-template-columns:1fr 1fr; gap:22px; margin-top:22px; }
  @media (max-width:700px){ .two-col{ grid-template-columns:1fr;} }
  .recent { list-style:none; }
  .recent li { display:flex; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); }
  .recent li:last-child{ border-bottom:0; }
  .recent img { width:34px; height:34px; border-radius:6px; object-fit:cover; background:#2a2a2a; }
  .recent .t { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .recent .a { font-size:12px; color:var(--muted); }
  .recent .time { font-size:11px; color:#666; margin-left:auto; white-space:nowrap; }

  .section-gap { margin-top:22px; }
  .muted-note { color:var(--muted); font-size:13px; text-align:center; padding:30px; }
  .toast {
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--accent); color:#000; font-weight:700; padding:12px 22px; border-radius:999px;
    opacity:0; transition:all .25s ease; pointer-events:none;
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="dot"></span> Now Playing · Painel</div>
    <a class="btn green" href="/login">+ Conectar Spotify</a>
  </div>

  <div class="wrap" id="app"><!-- render dinâmico --></div>

  <div class="toast" id="toast"></div>

<script>
  const $ = (s,r=document)=>r.querySelector(s);
  const app = $("#app");
  const toast = $("#toast");
  let connections = [];
  let activeId = null;
  let cfg = null;
  let saveTimer = null;

  const PRESET_ACCENTS = ["#1db954","#e2444a","#ff8a00","#8b5cf6","#3b82f6","#ec4899","#ffffff"];

  function showToast(msg){
    toast.textContent = msg; toast.classList.add("show");
    setTimeout(()=>toast.classList.remove("show"), 1600);
  }
  const fmtDur = (ms)=>{
    const min = Math.round(ms/60000);
    if (min < 60) return min+" min";
    const h = Math.floor(min/60);
    return h+"h "+(min%60)+"min";
  };
  const timeAgo = (ts)=>{
    const s = Math.floor((Date.now()-ts)/1000);
    if (s<60) return "agora";
    if (s<3600) return Math.floor(s/60)+"min atrás";
    if (s<86400) return Math.floor(s/3600)+"h atrás";
    return Math.floor(s/86400)+"d atrás";
  };

  async function loadConnections(){
    connections = await (await fetch("/api/connections")).json();
  }

  async function selectConn(id){
    activeId = id;
    const d = await (await fetch(`/api/connection/${id}`)).json();
    cfg = d.config;
    render();
    loadMetrics(id);
  }

  function queueSave(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async ()=>{
      await fetch(`/api/config/${activeId}`, {
        method:"PUT", headers:{"Content-Type":"application/json"},
        body:JSON.stringify(cfg),
      });
      // recarrega o iframe de preview pra refletir
      const f = $("#preview-frame");
      if (f) f.contentWindow.location.reload();
      showToast("Salvo");
    }, 400);
  }

  function setCfg(key, val){ cfg[key]=val; queueSave(); renderControlsValues(); }

  async function removeConn(id){
    if (!confirm("Remover esta conexão? A URL do widget deixará de funcionar.")) return;
    await fetch(`/api/connection/${id}`, {method:"DELETE"});
    activeId = null; cfg = null;
    await loadConnections();
    render();
    showToast("Conexão removida");
  }

  async function loadMetrics(id){
    try {
      const m = await (await fetch(`/api/metrics/${id}`)).json();
      const box = $("#metrics");
      if (!box) return;
      box.innerHTML = metricsHTML(m);
    } catch {}
  }

  function widgetUrl(id){ return `${location.origin}/widget/${id}`; }

  // ---------- templates ----------
  function connItem(c){
    const initials = (c.profile?.name||"?").slice(0,1).toUpperCase();
    const avatar = c.profile?.image
      ? `<img src="${c.profile.image}" alt="">`
      : `<div class="avatar">${initials}</div>`;
    const prod = c.profile?.product;
    const badge = prod ? `<span class="badge ${prod==='premium'?'premium':''}">${prod}</span>` : "";
    return `<div class="conn ${c.id===activeId?'active':''}" onclick="selectConn('${c.id}')">
      ${avatar}
      <div class="info">
        <div class="name">${c.profile?.name||"Conta Spotify"}</div>
        <div class="sub">${c.plays} plays registrados</div>
      </div>
      ${badge}
    </div>`;
  }

  function controlsHTML(){
    return `
    <div class="control">
      <label>Barras <span class="val" id="v-bars">${cfg.bars}</span></label>
      <input type="range" min="8" max="48" value="${cfg.bars}" oninput="setCfg('bars', +this.value)">
    </div>
    <div class="control">
      <label>Atualização <span class="val" id="v-poll">${(cfg.poll/1000).toFixed(1)}s</span></label>
      <input type="range" min="1000" max="8000" step="500" value="${cfg.poll}" oninput="setCfg('poll', +this.value)">
    </div>
    <div class="control">
      <label>Cantos <span class="val" id="v-corner">${cfg.cornerRadius}px</span></label>
      <input type="range" min="0" max="40" value="${cfg.cornerRadius}" oninput="setCfg('cornerRadius', +this.value)">
    </div>
    <div class="control">
      <label>Cor de destaque</label>
      <div class="swatches" id="swatches">
        ${PRESET_ACCENTS.map(c=>`<div class="swatch ${cfg.accent.toLowerCase()===c?'sel':''}" style="background:${c}" onclick="setCfg('accent','${c}')"></div>`).join("")}
        <input type="color" value="${cfg.accent}" oninput="setCfg('accent', this.value)">
      </div>
    </div>
    <div class="control">
      <label>Cor de fundo</label>
      <div class="swatches">
        <input type="color" value="${cfg.bg}" oninput="setCfg('bg', this.value)">
        <span class="val" style="align-self:center">Cartão</span>
        <input type="color" value="${cfg.card}" oninput="setCfg('card', this.value)">
      </div>
    </div>
    <div class="control" style="margin-top:20px">
      <div class="toggle-row"><span>Mostrar álbum</span>${sw('showAlbum')}</div>
      <div class="toggle-row"><span>Rolar título longo</span>${sw('scrollTitle')}</div>
      <div class="toggle-row"><span>Ocultar quando pausado</span>${sw('hideWhenPaused')}</div>
    </div>`;
  }
  function sw(key){
    return `<label class="switch"><input type="checkbox" ${cfg[key]?'checked':''} onchange="setCfg('${key}', this.checked)"><span class="slider"></span></label>`;
  }

  function renderControlsValues(){
    if ($("#v-bars")) $("#v-bars").textContent = cfg.bars;
    if ($("#v-poll")) $("#v-poll").textContent = (cfg.poll/1000).toFixed(1)+"s";
    if ($("#v-corner")) $("#v-corner").textContent = cfg.cornerRadius+"px";
    document.querySelectorAll("#swatches .swatch").forEach(s=>{
      const bg = s.style.background;
      s.classList.toggle("sel", rgbToHex(bg)===cfg.accent.toLowerCase());
    });
  }
  function rgbToHex(rgb){
    const m = rgb.match(/\d+/g);
    if (!m) return rgb;
    return "#"+m.slice(0,3).map(x=>(+x).toString(16).padStart(2,"0")).join("");
  }

  function metricsHTML(m){
    if (!m || m.totalPlays===0){
      return `<div class="muted-note">Ainda sem dados. Toque algo no Spotify e as métricas aparecem aqui — o servidor amostra a cada 30s.</div>`;
    }
    const stat = (num,lbl)=>`<div class="stat"><div class="num">${num}</div><div class="lbl">${lbl}</div></div>`;
    const top = (arr, withCount=true)=> arr.length? arr.map((x,i)=>
      `<li><span class="rank">${i+1}</span><span class="nm">${x.name}</span>${withCount?`<span class="ct">${x.count}×</span>`:""}</li>`).join("")
      : `<li class="muted-note" style="padding:12px">sem dados</li>`;
    const recent = m.recent.map(r=>`
      <li>
        ${r.image?`<img src="${r.image}">`:`<div class="recent-ph"></div>`}
        <div style="min-width:0">
          <div class="t">${r.title}</div>
          <div class="a">${r.artist}</div>
        </div>
        <span class="time">${timeAgo(r.playedAt)}</span>
      </li>`).join("");

    return `
      <div class="stats">
        ${stat(m.playsToday,"Plays hoje")}
        ${stat(m.playsWeek,"Na semana")}
        ${stat(m.uniqueArtists,"Artistas")}
        ${stat(fmtDur(m.listenedMs),"Tempo tocado")}
      </div>
      <div class="two-col">
        <div>
          <h2 style="border:0;padding:16px 0 8px">Top artistas</h2>
          <ul class="toplist">${top(m.topArtists)}</ul>
        </div>
        <div>
          <h2 style="border:0;padding:16px 0 8px">Top faixas</h2>
          <ul class="toplist">${top(m.topTracks)}</ul>
        </div>
      </div>
      <div class="section-gap">
        <h2 style="border:0;padding:16px 0 8px">Tocadas recentemente</h2>
        <ul class="recent">${recent}</ul>
      </div>`;
  }

  function render(){
    if (connections.length === 0){
      app.innerHTML = `
        <div class="empty-state">
          <h1>Nenhuma conexão ainda</h1>
          <p>Conecte uma conta do Spotify para gerar o widget e começar a coletar métricas de reprodução.</p>
          <a class="btn green" href="/login">Conectar com Spotify</a>
        </div>`;
      return;
    }
    if (!activeId){ activeId = connections[0].id; }

    app.innerHTML = `
      <div class="grid">
        <div class="card">
          <h2>Conexões</h2>
          <div class="body" style="display:flex;flex-direction:column;gap:6px">
            ${connections.map(connItem).join("")}
          </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:22px">
          <div class="card">
            <h2>Preview ao vivo</h2>
            <div class="body">
              <div class="preview-stage">
                <iframe id="preview-frame" src="${widgetUrl(activeId)}"></iframe>
              </div>
              <label style="display:block;font-size:13px;font-weight:600;margin:18px 0 4px">URL para o OBS</label>
              <div class="url-row">
                <input id="wurl" readonly value="${widgetUrl(activeId)}">
                <button class="btn green sm" onclick="copyUrl()">Copiar</button>
                <button class="btn sm ghost-danger" onclick="removeConn('${activeId}')">Remover</button>
              </div>
            </div>
          </div>

          <div class="grid" style="grid-template-columns:300px 1fr">
            <div class="card">
              <h2>Ajustes</h2>
              <div class="body">${cfg?controlsHTML():""}</div>
            </div>
            <div class="card">
              <h2>Métricas</h2>
              <div class="body" id="metrics"><div class="muted-note">Carregando…</div></div>
            </div>
          </div>
        </div>
      </div>`;
    // garante config carregada da conexão ativa
    if (!cfg) selectConn(activeId);
    else loadMetrics(activeId);
  }

  function copyUrl(){
    const i = $("#wurl"); i.select(); document.execCommand("copy");
    showToast("URL copiada");
  }

  // ---------- init ----------
  (async ()=>{
    // se voltou do OAuth com ?connected=<id>
    const params = new URLSearchParams(location.search);
    const justConnected = params.get("connected");
    await loadConnections();
    if (justConnected && connections.some(c=>c.id===justConnected)){
      activeId = justConnected;
      history.replaceState({}, "", "/");
      showToast("Conta conectada!");
    }
    render();
    if (activeId) selectConn(activeId);
    // atualiza métricas periodicamente
    setInterval(()=>{ if(activeId) loadMetrics(activeId); }, 20000);
  })();
</script>
</body>
</html>
