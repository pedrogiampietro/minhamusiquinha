<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Widget pronto</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:"Segoe UI",system-ui,sans-serif;
    background:#0d0d0d; color:#fff; min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card {
    background:#171717; border-radius:24px; padding:44px 40px;
    max-width:560px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  h1 { font-size:24px; margin-bottom:8px; text-align:center; }
  .sub { color:#a0a0a0; font-size:14px; text-align:center; margin-bottom:26px; }
  .url-box {
    display:flex; gap:8px; margin-bottom:26px;
  }
  input {
    flex:1; background:#0d0d0d; border:1px solid #2a2a2a; color:#1db954;
    padding:14px 16px; border-radius:12px; font-size:13px; font-family:monospace;
  }
  button {
    background:#1db954; color:#000; font-weight:700; border:none;
    padding:0 22px; border-radius:12px; cursor:pointer; font-size:14px;
    transition:background .15s ease;
  }
  button:hover { background:#1ed760; }
  ol { color:#c0c0c0; font-size:14px; line-height:1.9; padding-left:20px; }
  ol b { color:#fff; }
  a.preview {
    display:inline-block; margin-top:22px; color:#1db954;
    font-size:14px; text-decoration:none; font-weight:600;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>✅ Conectado!</h1>
    <p class="sub">Copie a URL abaixo e adicione como <b>Browser Source</b> no OBS.</p>

    <div class="url-box">
      <input id="url" readonly />
      <button onclick="copy()">Copiar</button>
    </div>

    <ol>
      <li>No OBS: <b>Fontes → + → Navegador (Browser)</b></li>
      <li>Cole a URL no campo <b>URL</b></li>
      <li>Largura <b>680</b> · Altura <b>200</b></li>
      <li>Marque <b>"Atualizar o navegador quando a cena ficar ativa"</b></li>
    </ol>

    <a class="preview" id="preview" target="_blank">→ Abrir preview do widget</a>
  </div>

<script>
  const url = new URLSearchParams(location.search).get("url") || "";
  document.getElementById("url").value = url;
  document.getElementById("preview").href = url;
  function copy() {
    const i = document.getElementById("url");
    i.select(); document.execCommand("copy");
    const b = document.querySelector("button");
    b.textContent = "Copiado!";
    setTimeout(() => (b.textContent = "Copiar"), 1500);
  }
</script>
</body>
</html>
